# Reconstruit le site chaque nuit (00:05 heure de Paris en été, 23:05 en
# hiver) via un "build hook" Netlify : les pages statiques reflètent ainsi
# toujours l'état réel des promotions (ex. fin de l'offre de lancement le
# 12/10 à 23:59) sans intervention manuelle.
#
# Mise en place (une fois) :
#   1. Netlify > Site configuration > Build & deploy > Build hooks > "Add
#      build hook" (branche main) et copier l'URL.
#   2. GitHub > dépôt > Settings > Secrets and variables > Actions > New
#      repository secret : NETLIFY_BUILD_HOOK = l'URL copiée.
name: Rebuild nightly

on:
  schedule:
    - cron: "5 22 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le build Netlify
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Secret NETLIFY_BUILD_HOOK absent : rien à faire."
            exit 0
          fi
          curl -fsS -X POST -d '{}' "$HOOK"
