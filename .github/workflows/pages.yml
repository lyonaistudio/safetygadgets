# Publie le site sur GitHub Pages à chaque push
# sur main, et le reconstruit chaque nuit pour que les promos datées (fin de
# l'offre de lancement) s'appliquent sans intervention.
name: Publication GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tant que safety-gadgets.com pointe vers Squarespace, le site est servi
      # sur lyonaistudio.github.io/safetygadgets/. Une fois le DNS du domaine
      # pointé vers GitHub : vider BASE et remettre le domaine personnalisé.
      - run: npx astro build --base "$BASE"
        env:
          BASE: /safetygadgets
      - run: python3 scripts/prefix-base.py dist /safetygadgets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
